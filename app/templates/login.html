{% extends 'base.html' %}
{% block title %}Connexion — Cloud Inventory{% endblock %}
{% block content %}
<section class="row justify-content-center" aria-labelledby="login-title">
  <div class="col-12 col-md-6 col-lg-4">
    <h1 id="login-title">Connexion</h1>
    {% if error %}<p id="login-error" class="alert alert-danger" role="alert">Identifiants invalides.</p>{% endif %}
    <form method="post" action="{{ url_for('login_page.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="username">Utilisateur</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required maxlength="128" {% if error %}aria-describedby="login-error"{% endif %}>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required maxlength="4096" {% if error %}aria-describedby="login-error"{% endif %}>
      </div>
      <button class="btn btn-primary" type="submit">Connexion</button>
    </form>
  </div>
</section>
{% endblock %}
