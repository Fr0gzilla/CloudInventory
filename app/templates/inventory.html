{% extends "base.html" %}
{% block title %}Inventaire — Cloud Inventory{% endblock %}
{% block content %}
<h1>Inventaire</h1>
<form id="inventory-filters" class="row g-3 mb-3" role="search">
  <div class="col-md-4"><label for="q" class="form-label">Recherche</label><input class="form-control" id="q" name="q" type="search" maxlength="255"></div>
  <div class="col-md-2"><label for="status" class="form-label">Statut</label><input class="form-control" id="status" name="status" maxlength="255"></div>
  <div class="col-md-2"><label for="node" class="form-label">Nœud</label><input class="form-control" id="node" name="node" maxlength="255"></div>
  <div class="col-md-2"><label for="type" class="form-label">Type</label><select class="form-select" id="type" name="type"><option value="">Tous</option><option value="qemu">QEMU</option><option value="lxc">LXC</option></select></div>
  <div class="col-md-2"><label for="match" class="form-label">Correspondance</label><select class="form-select" id="match" name="match"><option value="">Toutes</option><option value="MATCHED_NAME">Nom</option><option value="MATCHED_FQDN">FQDN</option><option value="MATCHED_IP">IP</option><option value="NO_MATCH">Aucune</option></select></div>
  <div class="col-md-3"><label for="tag" class="form-label">Tag</label><input class="form-control" id="tag" name="tag" maxlength="255"></div>
  <div class="col-md-3"><label for="sort" class="form-label">Trier par</label><select class="form-select" id="sort" name="sort"><option value="vm_id">ID VM</option><option value="vm_name">Nom</option><option value="type">Type</option><option value="node">Nœud</option><option value="status">Statut</option><option value="ip_final">IP finale</option><option value="dns_final">DNS final</option><option value="match_status">Correspondance</option><option value="role">Rôle</option><option value="cpu">CPU</option><option value="ram">RAM</option><option value="disk">Disque</option><option value="uptime">Disponibilité</option></select></div>
  <div class="col-md-2"><label for="order" class="form-label">Ordre</label><select class="form-select" id="order" name="order"><option value="asc">Croissant</option><option value="desc">Décroissant</option></select></div>
  <div class="col-md-4 d-flex align-items-end gap-2"><button class="btn btn-primary" type="submit">Filtrer</button><a id="inventory-export" class="btn btn-outline-primary" href="{{ url_for('web.inventory_export') }}">Exporter en CSV</a></div>
</form>
<p id="inventory-message" role="status" aria-live="polite">Chargement de l’inventaire…</p>
<div class="table-responsive"><table class="table table-striped"><caption>Assets du dernier inventaire</caption><thead><tr><th scope="col">ID VM</th><th scope="col">Nom</th><th scope="col">Type</th><th scope="col">Nœud</th><th scope="col">Statut</th><th scope="col">IP finale</th><th scope="col">DNS final</th><th scope="col">Correspondance</th><th scope="col">Rôle</th></tr></thead><tbody id="inventory-rows"></tbody></table></div>
<nav aria-label="Pagination de l’inventaire" class="d-flex align-items-center gap-3"><button id="inventory-prev" type="button" class="btn btn-outline-secondary" disabled>Précédent</button><span id="inventory-page" aria-live="polite"></span><button id="inventory-next" type="button" class="btn btn-outline-secondary" disabled>Suivant</button></nav>
<script defer src="{{ url_for('static', filename='inventory.js') }}"></script>
{% endblock %}
