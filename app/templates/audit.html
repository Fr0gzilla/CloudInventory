{% extends "base.html" %}
{% block title %}Audit · Cloud Inventory{% endblock %}
{% block content %}
<h1>Journal d'audit</h1>
<form method="get" action="{{ url_for('audit.audit_page') }}">
  <label>Auteur <input name="actor" value="{{ actor }}" maxlength="128"></label>
  <label>Action <input name="action" value="{{ action }}" maxlength="128"></label>
  <label>Cible <input name="target" value="{{ target }}" maxlength="128"></label>
  <label>Depuis <input type="date" name="since" value="{{ since }}"></label>
  <label>Jusqu'au <input type="date" name="until" value="{{ until }}"></label>
  <button type="submit">Filtrer</button>
</form>
<table class="table"><thead><tr><th>Date</th><th>Auteur</th><th>Action</th><th>Cible</th></tr></thead>
<tbody>{% for row in rows %}<tr><td>{{ row.created_at }}</td><td>{{ row.actor_identity }}</td><td>{{ row.action }}</td><td>{{ row.target }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
