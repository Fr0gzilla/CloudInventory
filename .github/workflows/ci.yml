name: ci
on: [push, pull_request]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET_KEY: ci-only-jwt-secret-key
      ADMIN_PASSWORD: ci-only-admin-password
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app collector
      - run: mypy app collector
      - run: coverage run -m pytest tests/ -q
      - run: coverage report --fail-under=0
      - run: bandit -r app collector -q
      - run: pip-audit -r requirements.txt
