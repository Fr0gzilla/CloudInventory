services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/cloudinventory.db  # chemin absolu : un chemin relatif irait dans instance/ (non inscriptible)
      - RATE_LIMIT_STORE_PATH=/app/data/login-budgets.json  # compteurs de connexion partagés par les workers, sur le volume inscriptible
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sqlite_data: